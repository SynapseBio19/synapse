[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The product is called Synapse. The distribution name follows the owner's
# domain, because "synapse" is already taken on the Python Package Index;
# the import names (analyses, core, ui, ...) are unchanged.
name = "synapse-gen"
version = "0.2.0.dev0"
description = "Transparent, sequence-centric DNA analysis workbench (research/teaching software, not experimentally validated)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - all rights reserved (decision pending)" }
authors = [{ name = "Onur Bayraktar" }]
keywords = ["bioinformatics", "DNA", "sequence analysis", "primer design", "BLAST", "ORF", "HGVS", "cloning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The scientific core deliberately uses only the Python standard library.
dependencies = []

[project.urls]
Homepage = "https://synapse-gen.com"

[project.scripts]
# The interactive session (synapse_gen/app.py; from the source folder also `python main.py`).
synapse = "synapse_gen.app:cli"

[project.optional-dependencies]
# Independent reference implementations used for cross-validation only.
reference = ["biopython>=1.81", "primer3-py>=2.0"]
# Optional energy model for the RNA secondary-structure view (MFE with ViennaRNA).
structure = ["ViennaRNA>=2.6"]
# Development tools; the suite itself runs with the standard-library unittest.
dev = ["pyright[nodejs]==1.1.414", "ruff==0.14.4", "coverage>=7.10"]

[tool.setuptools]
# analyses._blast, analyses._primer (Phase 7.1), analyses._mutation and
# analyses._cloning (Phase 8): internal packages of the public modules of
# the same name.
packages = ["analyses", "analyses._blast", "analyses._primer", "analyses._mutation", "analyses._cloning", "analyses._protein", "core", "data", "fileio", "synapse_gen", "ui"]

[tool.setuptools.package-data]
# The example sequence that Enter loads in the session (moved from examples/ in Phase 9).
data = ["examples/*.fasta"]


[tool.pyright]
# Check against the oldest supported version (requires-python >= 3.10).
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["main.py", "synapse_gen", "analyses", "core", "data", "fileio", "ui", "tests"]
exclude = ["LEGACY", "Synapse_Website", "**/__pycache__", ".venv"]
typeCheckingMode = "standard"

[tool.ruff]
# Ruff's default rule set (pyflakes and the pycodestyle E4/E7/E9 errors).
target-version = "py310"
extend-exclude = ["LEGACY", "Synapse_Website", ".tools"]

[tool.ruff.lint.per-file-ignores]
# One lambda assignment in a CRISPR test; CRISPR code and tests are not
# changed in Phase 7 (owner decision of 2026-11-17).
"tests/test_phase6_tier2.py" = ["E731"]
# The public modules re-export the implementation of their internal
# packages (Phase 7.1); the imports are the interface, not unused code.
"analyses/blast.py" = ["F401"]
"analyses/primer.py" = ["F401"]
"analyses/mutation.py" = ["F401"]
"analyses/cloning.py" = ["F401"]
"analyses/protein.py" = ["F401"]
