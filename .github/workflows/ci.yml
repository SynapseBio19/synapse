# Continuous integration for Synapse (Phase 7, 2026-11-17).
#
# The repository had no hosted remote when this file was written, so the
# workflow has not run on GitHub yet; every step was run locally (see
# docs/PHASE7_FINAL_REPORT.md, section G, and docs/PHASE71_FINAL_REPORT.md,
# section H). No paid service is used.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Mandatory: the standard-library-only install the README describes.
    # Tests that need an optional package or BLAST+ skip with their reason,
    # which is listed in the job summary.
    name: Tests, Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Synapse (no runtime dependencies)
        run: python -m pip install .
      # Run outside the checkout so that Python imports the installed
      # package, not the source tree. Every later step runs in the checkout,
      # so a package missing from pyproject.toml would otherwise go
      # unnoticed (Phase 7.1: analyses._blast and analyses._primer).
      - name: Import check (installed package)
        run: |
          cd "$RUNNER_TEMP"
          python -I -c "
          import importlib, pkgutil
          import analyses, core, data, fileio, synapse_gen, ui
          names = [m.name for p in (analyses, core, data, fileio, synapse_gen, ui)
                   for m in pkgutil.walk_packages(p.__path__, p.__name__ + '.')]
          for name in names:
              importlib.import_module(name)
          import analyses.blast, analyses.cloning, analyses.restriction
          assert 'site-packages' in analyses.blast.__file__, analyses.blast.__file__
          assert analyses.blast.run_self_test(verbose=False)
          assert analyses.cloning.run_cloning_self_test()['all_passed']
          assert analyses.restriction.run_restriction_self_test()['all_passed']
          print(len(names), 'modules import from', analyses.blast.__file__)"
          # The installed command starts the session and quits on Q.
          printf 'Q\n' | synapse
      - name: Golden master
        run: python -m unittest -v tests.test_golden_master
      - name: Test suite
        run: python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Skipped tests
        if: always()
        run: python scripts/ci/check_skips.py test-output.txt

  reference:
    # Optional dependencies installed: Biopython, primer3-py, ViennaRNA and
    # BLAST+. Here only the opt-in benchmark may skip, so a reference
    # comparison cannot be lost silently.
    name: Reference comparisons (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+
      - name: Install Synapse with the optional extras
        run: python -m pip install ".[reference,structure]" "coverage>=7.10"
      - name: Test suite with coverage
        run: |
          python -m coverage run --branch --source=analyses,core,ui,fileio,data,main,synapse_gen -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
          test ${PIPESTATUS[0]} -eq 0
      # Only the opt-in benchmark and the opt-in refseq_rna searches (about 80 GB
      # database) may skip here.
      - name: Only the opt-in tests may skip
        if: always()
        run: python scripts/ci/check_skips.py test-output.txt --only "SYNAPSE_BENCHMARK=1" --only "SYNAPSE_REFSEQ_RNA_TESTS=1"
      - name: Coverage report
        if: always()
        run: python -m coverage report --sort=cover | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    name: Ruff and pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml points pyright at ./.venv, so the tools are installed there.
      - name: Install development tools into .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ".[dev,reference,structure]"
      - name: Ruff
        run: .venv/bin/python -m ruff check .
      - name: Pyright (no error outside the documented allow-list)
        run: .venv/bin/python scripts/ci/pyright_gate.py
